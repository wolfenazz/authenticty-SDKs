[package]
name = "authenticity"
version = "0.1.0"
edition = "2021"
description = "Authenticity auth/licensing client SDK for Rust"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"

[dependencies.reqwest]
version = "0.12"
default-features = false
features = ["blocking", "json", "rustls-tls"]

[features]
default = []



